name: Self test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Check dashboard JavaScript
        run: node --check static/app.js
      - name: Run bot self-test
        run: python self_test.py
      - name: Run base backtester self-test
        run: python backtest_self_test.py
      - name: Run guarded-layer self-test
        run: python backtest_guard_self_test.py
      - name: Run selective-layer self-test
        run: python backtest_selective_self_test.py
      - name: Run efficient-layer self-test
        run: python backtest_efficiency_self_test.py
      - name: Run OOS helper self-test
        run: python backtest_oos_self_test.py
      - name: Run v2.5 research self-test
        run: python backtest_v25_self_test.py
      - name: Run progress/cache self-test
        run: python backtest_progress_self_test.py
      - name: Run portfolio-cap self-test
        run: python portfolio_cap_self_test.py
      - name: Run full CPU pipeline self-test
        run: python backtest_full_cpu_runner.py --self-test
