name: Self test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Check dashboard JavaScript
        run: node --check static/app.js
      - name: Run bot self-test
        run: python self_test.py
      - name: Run v2.4 backtester self-test
        run: python backtest_self_test.py
      - name: Run v2.4 guarded protection self-test
        run: python backtest_guard_self_test.py
      - name: Run v2.4 progress runner self-test
        run: python backtest_progress_self_test.py
